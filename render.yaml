services:
  - type: web
    name: resumize
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_PATH
        value: /tmp/resumize.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: ALLOWED_ORIGINS
        value: https://resumize.nagilla.me
      - key: GROQ_API_KEY
        sync: false
    customDomains:
      - name: resumize.nagilla.me
